spring:
  application:
    name: goaltracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/goaltracker}
    username: ${SPRING_DATASOURCE_USERNAME:goaltracker}
    password: ${SPRING_DATASOURCE_PASSWORD:goaltracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ttl-seconds: ${JWT_TTL_SECONDS:86400}
    demo:
      users:
        - username: ilya
          password: ilya123
          display-name: Ilya
          roles:
            - ROLE_USER
        - username: alice
          password: alice123
          display-name: Alice
          roles:
            - ROLE_USER
        - username: admin
          password: admin123
          display-name: Admin
          roles:
            - ROLE_ADMIN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
